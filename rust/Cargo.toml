[package]
name = "laed_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
# Enable only after the three pinned runtime adapters have been linked.
native-models = []

[dependencies]
anyhow = "1.0.99"
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

